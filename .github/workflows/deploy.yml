name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t softtrendskathir/herokuapp:latest .

    - name: Push Docker Image
      run: docker push softtrendskathir/herokuapp:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop herokuapp || true
          sudo docker rm herokuapp || true
          sudo docker pull softtrendskathir/herokuapp:latest
          sudo docker run -d -p 80:8080 \
            -e PORT=8080 \
            --name herokuapp \
            --restart always \
            softtrendskathir/herokuapp:latest
